[project]
name = "rigidbench"
version = "0.1.0"
description = "Simulator-grounded evaluation of rigid-body physics in video generation models"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Swarnim Jain", email = "swarnimjain004@gmail.com" },
]
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "pyyaml>=6",
    "requests>=2.31",
    "scipy>=1.11",
    "tqdm>=4.66",
]

[project.optional-dependencies]
eval = [
    "easydict>=1.13",
    "einops>=0.8",
    "huggingface-hub>=0.28",
    "lpips==0.1.4",
    "pytorch-msssim>=1.0",
    "sam2>=1.1.0",
    "timm>=1.0",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
]
wan = [
    "accelerate>=1.2",
    "diffsynth>=2.0.11",
    "huggingface-hub>=0.28",
    "peft>=0.13",
    "sentencepiece>=0.2",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "transformers>=4.48,<5",
]
cosmos = [
    "accelerate>=1.2",
    "diffusers>=0.35",
    "huggingface-hub>=0.28",
    "sentencepiece>=0.2",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "transformers>=4.48,<5",
]
replicate = [
    "replicate>=0.25",
]
scenes = [
    "pymunk>=6",
]
train = [
    "accelerate>=1.2",
    "diffsynth>=2.0.11",
    "huggingface-hub>=0.28",
    "imageio>=2.36",
    "imageio-ffmpeg>=0.5",
    "lightning>=2.6",
    "peft>=0.13",
    "sentencepiece>=0.2",
    "torch>=2.5.1",
    "transformers>=4.48,<5",
    "wandb>=0.19",
]
probe = [
    "scikit-learn>=1.6",
    "torch>=2.5.1",
    "wandb>=0.19",
]
dev = [
    "ruff>=0.9",
]

[project.scripts]
rigidbench = "rigidbench.cli:main"

[project.urls]
Repository = "https://github.com/swarnim-j/RigidBench"
Dataset = "https://doi.org/10.5281/zenodo.21649156"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rigidbench"]

[tool.hatch.build.targets.sdist]
include = [
    "/.env.example",
    "/.python-version",
    "/CITATION.cff",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src",
    "/uv.lock",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
